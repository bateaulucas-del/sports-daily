<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏀🏈 Sports Daily</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; font-weight: 800; color: #fff; }
    header p { color: #8b949e; margin-top: 0.4rem; font-size: 0.9rem; }
    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 0.6rem;
    }
    .section { margin-bottom: 2rem; }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #58a6ff;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .match {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
    }
    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .score { color: #f0a500; font-size: 1.2rem; }
    .detail { color: #8b949e; font-size: 0.85rem; margin-top: 0.4rem; }
    .empty { color: #8b949e; font-style: italic; font-size: 0.9rem; }
    footer { text-align: center; color: #484f58; font-size: 0.8rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏀🏈 Sports Daily</h1>
      <p>Résultats NBA & NFL de la nuit</p>
      <span class="badge" id="update-time">En attente du premier update…</span>
    </header>

    <div class="section">
      <div class="section-title">🏀 NBA</div>
      <div class="empty">Les résultats apparaîtront demain matin à 9h.</div>
    </div>

    <div class="section">
      <div class="section-title">🏈 NFL</div>
      <div class="empty">Les résultats apparaîtront demain matin à 9h.</div>
    </div>

    <footer>Mis à jour automatiquement chaque matin · Lucas Bateau</footer>
  </div>
</body>
</html>
