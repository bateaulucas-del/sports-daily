<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --nba-bg: #060b18;
      --nba-surface: #0d1526;
      --nba-border: #1a2a44;
      --nba-accent: #1a6db5;
      --nba-accent-soft: #1d3a5c;
      --nba-stat: #60a5fa;

      --nfl-bg: #100608;
      --nfl-surface: #1a0a0c;
      --nfl-border: #3a1418;
      --nfl-accent: #b51a26;
      --nfl-accent-soft: #5c1d22;
      --nfl-stat: #f87171;

      --text-primary: #f0f4f8;
      --text-secondary: #8899aa;
      --text-muted: #445566;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.4s ease;
    }

    body.nba {
      --bg: var(--nba-bg);
      --surface: var(--nba-surface);
      --border: var(--nba-border);
      --accent: var(--nba-accent);
      --accent-soft: var(--nba-accent-soft);
      --stat-color: var(--nba-stat);
    }

    body.nfl {
      --bg: var(--nfl-bg);
      --surface: var(--nfl-surface);
      --border: var(--nfl-border);
      --accent: var(--nfl-accent);
      --accent-soft: var(--nfl-accent-soft);
      --stat-color: var(--nfl-stat);
    }

    header {
      padding: 2rem 1.5rem 0;
      max-width: 820px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .toggle-btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      padding: 0.6rem 2rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Date selector */
    .date-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
    }

    .date-selector select {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      max-width: 200px;
    }

    .date-selector select option {
      background: #1a1a2e;
      color: var(--text-primary);
    }

    .date-icon { font-size: 0.9rem; color: var(--text-muted); }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .sport-section { display: none; }
    .sport-section.visible { display: block; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* Loading / empty state */
    .state-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 3rem 1rem;
      font-style: italic;
    }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .match-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      gap: 1rem;
    }

    .match-header:hover { background: rgba(255,255,255,0.03); }

    .team-score {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex: 1;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 110px;
    }

    .score-block {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--stat-color);
      line-height: 1;
      min-width: 60px;
      text-align: center;
    }

    .vs { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    .mvp-pill {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--stat-color);
      border-radius: 4px;
      padding: 0.25rem 0.6rem;
      white-space: nowrap;
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 0.8rem;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .match-card.open .expand-icon { transform: rotate(180deg); }

    .stats-panel {
      display: none;
      border-top: 1px solid var(--border);
    }

    .match-card.open .stats-panel { display: block; }

    .match-summary {
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-secondary);
      padding: 1rem 1.25rem;
      font-style: italic;
      border-bottom: 1px solid var(--border);
    }

    .match-summary strong {
      color: var(--stat-color);
      font-style: normal;
      font-weight: 600;
    }

    .team-stats-block { padding: 0 1.25rem 1.25rem; margin-top: 1.25rem; }

    .team-stats-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    .stats-table th {
      text-align: right;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.3rem 0.5rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .stats-table th:first-child { text-align: left; }

    .stats-table td {
      text-align: right;
      color: var(--text-secondary);
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .stats-table td:first-child {
      text-align: left;
      color: var(--text-primary);
      font-weight: 500;
    }

    .stats-table tr:last-child td { border-bottom: none; }
    .stat-highlight { color: var(--stat-color); font-weight: 600; }

    .position-group { margin-bottom: 1rem; }

    .position-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      padding-left: 0.5rem;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 2rem;
      border-top: 1px solid var(--border);
      max-width: 820px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .team-name { min-width: 80px; font-size: 0.82rem; }
      .score-block { font-size: 1.6rem; }
      .mvp-pill { display: none; }
      .top-bar { flex-direction: column; align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body class="nba">

<header>
  <div class="top-bar">
    <div class="toggle">
      <button class="toggle-btn active" onclick="switchSport('nba')" id="btn-nba">NBA</button>
      <button class="toggle-btn" onclick="switchSport('nfl')" id="btn-nfl">NFL</button>
    </div>
    <div class="date-selector">
      <span class="date-icon">📅</span>
      <select id="date-select" onchange="loadDate(this.value)">
        <option value="">Chargement…</option>
      </select>
    </div>
  </div>
</header>

<div class="container">
  <div class="sport-section visible" id="section-nba">
    <div class="section-label" id="label-nba">NBA</div>
    <div id="nba-content"><div class="state-msg">Chargement des données…</div></div>
  </div>
  <div class="sport-section" id="section-nfl">
    <div class="section-label" id="label-nfl">NFL</div>
    <div id="nfl-content"><div class="state-msg">Chargement des données…</div></div>
  </div>
</div>

<footer>Mis à jour automatiquement chaque matin · Lucas Bateau</footer>

<script>
  const REPO = 'bateaulucas-del/sports-daily';
  const DATA_URL = `https://raw.githubusercontent.com/${REPO}/main/historique.json`;

  let allData = {};
  let currentSport = 'nba';
  let currentDate = '';

  // Charger l'historique
  async function loadHistory() {
    try {
      const res = await fetch(DATA_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error('Pas encore de données');
      allData = await res.json();
      populateDateSelector();
    } catch(e) {
      document.getElementById('nba-content').innerHTML = '<div class="state-msg">Les données apparaîtront demain matin après le premier update automatique.</div>';
      document.getElementById('nfl-content').innerHTML = '<div class="state-msg">Les données apparaîtront demain matin après le premier update automatique.</div>';
      document.getElementById('date-select').innerHTML = '<option>Aucune donnée</option>';
    }
  }

  function populateDateSelector() {
    const dates = Object.keys(allData).sort((a, b) => b.localeCompare(a));
    const sel = document.getElementById('date-select');
    sel.innerHTML = dates.map(d => {
      const label = formatDateLabel(d);
      return `<option value="${d}">${label}</option>`;
    }).join('');
    if (dates.length > 0) {
      currentDate = dates[0];
      renderDay(currentDate);
    }
  }

  function formatDateLabel(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    const opts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
    return d.toLocaleDateString('fr-FR', opts);
  }

  function loadDate(dateStr) {
    currentDate = dateStr;
    renderDay(dateStr);
  }

  function renderDay(dateStr) {
    const day = allData[dateStr];
    if (!day) return;

    // Update labels
    document.getElementById('label-nba').textContent = `NBA — ${formatDateLabel(dateStr)}`;
    document.getElementById('label-nfl').textContent = `NFL — ${formatDateLabel(dateStr)}`;

    // Render NBA
    renderMatches('nba-content', day.nba || [], 'nba');
    renderMatches('nfl-content', day.nfl || [], 'nfl');
  }

  function renderMatches(containerId, matches, sport) {
    const el = document.getElementById(containerId);
    if (!matches || matches.length === 0) {
      el.innerHTML = '<div class="state-msg">Aucun match cette nuit.</div>';
      return;
    }
    el.innerHTML = matches.map(m => renderMatchCard(m, sport)).join('');
  }

  function renderMatchCard(m, sport) {
    const statsHtml = sport === 'nba' ? renderNBAStats(m) : renderNFLStats(m);
    return `
      <div class="match-card" onclick="toggleMatch(this)">
        <div class="match-header">
          <div class="team-score">
            <span class="team-name">${m.team1}</span>
            <span class="score-block">${m.score1}</span>
            <span class="vs">—</span>
            <span class="score-block">${m.score2}</span>
            <span class="team-name">${m.team2}</span>
          </div>
          <span class="mvp-pill">⭐ ${m.mvp}</span>
          <span class="expand-icon">▼</span>
        </div>
        <div class="stats-panel">
          <div class="match-summary">${m.summary}</div>
          ${statsHtml}
        </div>
      </div>`;
  }

  function renderNBAStats(m) {
    const renderTeam = (teamName, players) => {
      if (!players || players.length === 0) return '';
      const rows = players.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.min}</td>
          <td class="${p.pts >= 20 ? 'stat-highlight' : ''}">${p.pts}</td>
          <td>${p.reb}</td>
          <td>${p.ast}</td>
          <td>${p.stl}</td>
          <td>${p.blk}</td>
          <td>${p.pm}</td>
        </tr>`).join('');
      return `
        <div class="team-stats-block">
          <div class="team-stats-title">${teamName}</div>
          <table class="stats-table">
            <thead><tr><th>Joueur</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>Stl</th><th>Blk</th><th>+/-</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    };
    return renderTeam(m.team1, m.players1) + renderTeam(m.team2, m.players2);
  }

  function renderNFLStats(m) {
    const renderSide = (teamName, offense, defense) => {
      const posGroups = ['QB', 'RB', 'WR', 'TE'];
      const offHeaders = { QB: 'Comp/Att/Yds/TD/INT/Rating', RB: 'Att/Yds/Avg/TD/Rec/RecYds', WR: 'Rec/Cibles/Yds/Avg/TD', TE: 'Rec/Cibles/Yds/Avg/TD' };

      let offHtml = posGroups.map(pos => {
        const players = offense && offense[pos];
        if (!players || players.length === 0) return '';
        const headers = offHeaders[pos].split('/');
        const rows = players.map(p => {
          const vals = p.stats.map((v, i) => `<td${i === 2 ? ' class="stat-highlight"' : ''}>${v}</td>`).join('');
          return `<tr><td>${p.name}</td>${vals}</tr>`;
        }).join('');
        return `
          <div class="position-group">
            <div class="position-label">${pos}</div>
            <table class="stats-table">
              <thead><tr><th>Joueur</th>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }).join('');

      let defHtml = '';
      if (defense && defense.length > 0) {
        const rows = defense.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>${p.tckl}</td>
            <td class="${parseFloat(p.sacks) > 0 ? 'stat-highlight' : ''}">${p.sacks}</td>
            <td>${p.tfl}</td>
            <td class="${p.int > 0 ? 'stat-highlight' : ''}">${p.int}</td>
            <td>${p.pd}</td>
            <td>${p.ff}</td>
          </tr>`).join('');
        defHtml = `
          <div class="team-stats-block">
            <div class="team-stats-title">${teamName} — Défense</div>
            <table class="stats-table">
              <thead><tr><th>Joueur</th><th>Tckl</th><th>Sacks</th><th>TFL</th><th>INT</th><th>PD</th><th>FF</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }

      return `
        <div class="team-stats-block">
          <div class="team-stats-title">${teamName} — Attaque</div>
          ${offHtml}
        </div>
        ${defHtml}`;
    };

    return renderSide(m.team1, m.offense1, m.defense1) + renderSide(m.team2, m.offense2, m.defense2);
  }

  function switchSport(sport) {
    currentSport = sport;
    document.body.className = sport;
    document.querySelectorAll('.sport-section').forEach(s => s.classList.remove('visible'));
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('section-' + sport).classList.add('visible');
    document.getElementById('btn-' + sport).classList.add('active');
  }

  function toggleMatch(card) {
    card.classList.toggle('open');
  }

  loadHistory();
</script>
</body>
</html>
